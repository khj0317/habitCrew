spring:
  application:
    name: habitcrew-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/habitcrew}
    username: ${DB_USERNAME:habitcrew}
    password: ${DB_PASSWORD:habitcrew}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6381}

server:
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

habitcrew:
  # 인증 마감·자정 정산의 기준 시간대
  zone: Asia/Seoul
  auth:
    # 리프레시 토큰 쿠키의 Secure 속성. https가 아닌 로컬에서는 application-local.yml에서 false
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  # 로그인 실패 제한: 같은 이메일로 5번 틀리면 10분 잠금
  login-limit:
    max-attempts: 5
    lock-duration: 10m

# 배포 시 JWT_SECRET을 32자 이상의 랜덤 문자열로 반드시 교체
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
  issuer: habitcrew
  access-token-ttl: 30m
  refresh-token-ttl: 14d

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180}
