spring:
  application:
    name: habitcrew-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/habitcrew}
    username: ${DB_USERNAME:habitcrew}
    password: ${DB_PASSWORD:habitcrew}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6381}

  # 메일: 로컬은 docker-compose의 Mailpit(SMTP 1026, 화면 http://localhost:8026), 배포 시 실제 SMTP
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1026}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  # 인증 사진: 브라우저에서 줄여서 보내지만, 원본을 그대로 보내는 경우를 대비해 10MB까지 받는다
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8090}

management:
  health:
    # 메일 서버가 잠깐 안 돼도 서버 자체는 정상으로 본다
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

habitcrew:
  # 인증 마감·자정 정산의 기준 시간대
  zone: Asia/Seoul
  # 메일 속 링크(비밀번호 재설정 등)가 가리킬 웹 주소
  web-base-url: ${WEB_BASE_URL:http://localhost:5180}
  mail-from: ${MAIL_FROM:HabitCrew <noreply@habitcrew.local>}
  # API 요청 수 제한 (도배·남용 방지)
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  auth:
    # 리프레시 토큰 쿠키의 Secure 속성. https가 아닌 로컬에서는 application-local.yml에서 false
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  # 인증 사진 저장소 (S3 호환). 로컬은 docker-compose의 SeaweedFS
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:habitcrew-photos}
    access-key: ${STORAGE_ACCESS_KEY:habitcrew}
    secret-key: ${STORAGE_SECRET_KEY:habitcrew-local-secret}
    # 사진 주소(서명 URL)의 유효 시간. 지나면 피드를 다시 불러와 새 주소를 받는다
    url-ttl: 1h
    # 서버가 뜰 때 버킷이 없으면 만든다 (로컬 전용, 배포에서는 미리 만들어 둔 버킷을 쓴다)
    create-bucket: ${STORAGE_CREATE_BUCKET:true}
  # 자정 정산: 매일 00:05(KST)에 어제 인증하지 않은 크루원에게 벌금을 매긴다
  settlement:
    enabled: ${SETTLEMENT_ENABLED:true}
    cron: "0 5 0 * * *"
    # 서버가 꺼져 있어 놓친 정산을 며칠 전까지 거슬러 올라가 따라잡을지
    catch-up-days: 7
  # 웹 푸시 알림
  push:
    # VAPID 연락처 (푸시 서버가 문제가 있을 때 연락하는 주소). 배포 시 실제 주소로
    subject: ${VAPID_SUBJECT:mailto:noreply@habitcrew.local}
    # 비워 두면 처음 뜰 때 만들어 DB에 저장한다. 서버를 여러 환경에 띄울 때는 같은 값을 넣는다 (base64url)
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    reminder-enabled: ${PUSH_REMINDER_ENABLED:true}
    reminder-cron: "0 0 22 * * *"
    # 이 도메인의 푸시 서버로만 보낸다 (SSRF 방지): 크롬·엣지(FCM), 파이어폭스, 사파리, 윈도우
    allowed-hosts: fcm.googleapis.com, updates.push.services.mozilla.com, web.push.apple.com, "*.push.apple.com", "*.notify.windows.com"
  # 로그인 실패 제한: 같은 이메일로 5번 틀리면 10분 잠금
  login-limit:
    max-attempts: 5
    lock-duration: 10m

# 배포 시 JWT_SECRET을 32자 이상의 랜덤 문자열로 반드시 교체
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
  issuer: habitcrew
  access-token-ttl: 30m
  refresh-token-ttl: 14d

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180}

# 로그마다 요청 ID를 붙여, 에러 응답의 requestId로 그 요청의 로그를 바로 찾을 수 있게 한다
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
