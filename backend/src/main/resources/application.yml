spring:
  application:
    name: habitcrew-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/habitcrew}
    username: ${DB_USERNAME:habitcrew}
    password: ${DB_PASSWORD:habitcrew}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6381}

  # 인증 사진: 브라우저에서 줄여서 보내지만, 원본을 그대로 보내는 경우를 대비해 10MB까지 받는다
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

habitcrew:
  # 인증 마감·자정 정산의 기준 시간대
  zone: Asia/Seoul
  auth:
    # 리프레시 토큰 쿠키의 Secure 속성. https가 아닌 로컬에서는 application-local.yml에서 false
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  # 인증 사진 저장소 (S3 호환). 로컬은 docker-compose의 SeaweedFS
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:habitcrew-photos}
    access-key: ${STORAGE_ACCESS_KEY:habitcrew}
    secret-key: ${STORAGE_SECRET_KEY:habitcrew-local-secret}
    # 사진 주소(서명 URL)의 유효 시간. 지나면 피드를 다시 불러와 새 주소를 받는다
    url-ttl: 1h
    # 서버가 뜰 때 버킷이 없으면 만든다 (로컬 전용, 배포에서는 미리 만들어 둔 버킷을 쓴다)
    create-bucket: ${STORAGE_CREATE_BUCKET:true}
  # 자정 정산: 매일 00:05(KST)에 어제 인증하지 않은 크루원에게 벌금을 매긴다
  settlement:
    enabled: ${SETTLEMENT_ENABLED:true}
    cron: "0 5 0 * * *"
    # 서버가 꺼져 있어 놓친 정산을 며칠 전까지 거슬러 올라가 따라잡을지
    catch-up-days: 7
  # 로그인 실패 제한: 같은 이메일로 5번 틀리면 10분 잠금
  login-limit:
    max-attempts: 5
    lock-duration: 10m

# 배포 시 JWT_SECRET을 32자 이상의 랜덤 문자열로 반드시 교체
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
  issuer: habitcrew
  access-token-ttl: 30m
  refresh-token-ttl: 14d

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180}
