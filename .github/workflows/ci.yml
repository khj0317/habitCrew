name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # 실제 PostgreSQL·Redis·SeaweedFS 컨테이너를 띄워 테스트한다 (GitHub 러너에는 Docker가 있다)
      - name: Test (Testcontainers)
        run: ./gradlew test --console=plain
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  web:
    name: Web type check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web

  e2e:
    name: E2E (Playwright, 휴대폰·데스크톱)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 로컬과 똑같이 PostgreSQL·Redis·SeaweedFS·Mailpit을 docker compose로 띄운다
      - name: Start infra
        run: docker compose up -d --wait
      - name: Start backend
        working-directory: backend
        run: nohup ./gradlew bootRun --console=plain > ../backend.log 2>&1 &
      - name: Start web
        run: nohup npm run dev:web > web.log 2>&1 &
      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Wait for servers
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:8090/actuator/health > /dev/null && curl -sf http://localhost:5180 > /dev/null && exit 0
            sleep 2
          done
          echo "서버가 뜨지 않았습니다"; tail -100 backend.log; exit 1
      - name: Run E2E
        run: npm run test:e2e -w @habitcrew/web
        env:
          CI: true
      - name: Server logs on failure
        if: failure()
        run: tail -200 backend.log; tail -50 web.log
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
