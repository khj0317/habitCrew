# 다른 프로젝트(fitmate 등)와 동시에 켜도 충돌하지 않도록 포트를 따로 쓴다.
#   PostgreSQL 5434 / Redis 6381 / 사진 저장소 8333 / 메일 1026·8026 / 백엔드 8090 / 웹 5180
name: habitcrew

services:
  postgres:
    image: postgres:17-alpine
    container_name: habitcrew-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: habitcrew
      POSTGRES_USER: habitcrew
      POSTGRES_PASSWORD: habitcrew
      TZ: Asia/Seoul
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitcrew -d habitcrew"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: habitcrew-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 인증 사진 저장소 (S3 호환). 배포 시 AWS S3·Cloudflare R2 등으로 주소와 키만 바꾸면 된다.
  # 접근 키를 설정해 두어, 서버가 발급한 서명 URL 없이는 사진을 볼 수 없다 (크루원만 보기)
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: habitcrew-seaweedfs
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256 -volume.max=8
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 개발용 메일 서버: 앱이 보낸 메일(비밀번호 재설정 등)을 http://localhost:8026 에서 확인 (실제로 발송되지 않음)
  mailpit:
    image: axllent/mailpit:latest
    container_name: habitcrew-mailpit
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  postgres-data:
  seaweedfs-data:
